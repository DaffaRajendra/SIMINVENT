<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMINVENT-Mini | Tambah Barang</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-xl bg-white border-bottom sticky-top py-0">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold me-0 py-3" href="../index.html">
                <img src="../assets/img/logo.png" alt="Logo SIMINVENT" height="40" class="me-2">
                SIMINVENT<span class="text-primary fw-normal">-Mini</span>
            </a>
            <button class="navbar-toggler" type="button" id="nav-toggle-btn" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html"><i class="bi bi-house-door me-1"></i>Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../barang/list.html"><i class="bi bi-box-seam me-1"></i>Barang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../peminjam/list.html"><i class="bi bi-people me-1"></i>Peminjam</a>
                    </li>
                </ul>
                <div class="aksi-navbar d-grid d-xl-flex gap-2 pb-3 pb-xl-0">
                    <a class="btn btn-outline-primary rounded-pill text-nowrap" href="../barang/tambah.html"><i class="bi bi-plus-lg"></i> Tambah Barang</a>
                    <a class="btn btn-primary rounded-pill text-nowrap" href="../peminjam/tambah.html"><i class="bi bi-person-plus"></i> Tambah Peminjam</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="bg-white border-bottom py-3">
        <div class="container py-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb small mb-1">
                            <li class="breadcrumb-item"><a href="../index.html" class="text-decoration-none">Home</a></li>
                            <li class="breadcrumb-item"><a href="list.html" class="text-decoration-none">Barang</a></li>
                            <li class="breadcrumb-item active">Tambah</li>
                        </ol>
                    </nav>
                    <h1 class="h3 fw-bold mb-0">Tambah Barang</h1>
                </div>
            </div>
        </div>
    </section>

    <main class="container py-5 flex-grow-1">
        <div class="card">
            <div class="card-body p-4">
                <form id="form-tambah" novalidate>
                    <div class="row g-4">
                    <div class="col-md-6">
                        <label for="kode_barang" class="form-label fw-semibold">Kode Barang</label>
                        <input type="text" id="kode_barang" name="kode_barang" class="form-control py-2" required>
                    </div>
                    <div class="col-md-6">
                        <label for="nama_barang" class="form-label fw-semibold">Nama Barang</label>
                        <input type="text" id="nama_barang" name="nama_barang" class="form-control py-2" required>
                    </div>
                    <div class="col-md-6">
                        <label for="kategori" class="form-label fw-semibold">Kategori</label>
                        <select id="kategori" name="kategori" class="form-select py-2">
                            <option value="perabotan">Perabotan</option>
                            <option value="elektronik">Elektronik</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="lokasi" class="form-label fw-semibold">Lokasi</label>
                        <input type="text" id="lokasi" name="lokasi" class="form-control py-2" required>
                    </div>
                    <div class="col-md-6">
                        <label for="stok" class="form-label fw-semibold">Stok</label>
                        <input type="number" id="stok" name="stok" class="form-control py-2" min="0" required>
                    </div>
                    <div class="col-md-6">
                        <label for="kondisi" class="form-label fw-semibold">Kondisi</label>
                        <select id="kondisi" name="kondisi" class="form-select py-2">
                            <option value="baik">Baik</option>
                            <option value="rusak">Rusak</option>
                        </select>
                    </div>
                        <div class="col-12 pt-2">
                            <button type="submit" class="btn btn-primary">Simpan</button>
                            <a href="list.html" class="btn btn-outline-secondary">Batal</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top text-center text-secondary small py-4 mt-auto">
        &copy; 2026 SIMINVENT-Mini &mdash; Jobsheet 6
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
