<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMINVENT-Mini | Tambah Peminjam</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-xl bg-white border-bottom sticky-top py-0">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold me-0 py-3" href="../index.html">
                <img src="../assets/img/logo.png" alt="Logo SIMINVENT" height="40" class="me-2">
                SIMINVENT<span class="text-primary fw-normal">-Mini</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html"><i class="bi bi-house-door me-1"></i>Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../barang/list.html"><i class="bi bi-box-seam me-1"></i>Barang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../peminjam/list.html"><i class="bi bi-people me-1"></i>Peminjam</a>
                    </li>
                </ul>
                <div class="aksi-navbar d-grid d-xl-flex gap-2 pb-3 pb-xl-0">
                    <a class="btn btn-outline-primary rounded-pill text-nowrap" href="../barang/tambah.html"><i class="bi bi-plus-lg"></i> Tambah Barang</a>
                    <a class="btn btn-primary rounded-pill text-nowrap" href="../peminjam/tambah.html"><i class="bi bi-person-plus"></i> Tambah Peminjam</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="bg-white border-bottom py-3">
        <div class="container py-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb small mb-1">
                            <li class="breadcrumb-item"><a href="../index.html" class="text-decoration-none">Home</a></li>
                            <li class="breadcrumb-item"><a href="list.html" class="text-decoration-none">Peminjam</a></li>
                            <li class="breadcrumb-item active">Tambah</li>
                        </ol>
                    </nav>
                    <h1 class="h3 fw-bold mb-0">Tambah Peminjam</h1>
                </div>
            </div>
        </div>
    </section>

    <main class="container py-5 flex-grow-1">
        <div class="card">
            <div class="card-body p-4">
                <form>
                    <div class="row g-4">
                    <div class="col-md-6">
                        <label for="nim" class="form-label fw-semibold">NIM / NIP</label>
                        <input type="text" id="nim" name="nim" class="form-control py-2" required>
                    </div>
                    <div class="col-md-6">
                        <label for="nama" class="form-label fw-semibold">Nama</label>
                        <input type="text" id="nama" name="nama" class="form-control py-2" required>
                    </div>
                    <div class="col-md-6">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select id="status" name="status" class="form-select py-2">
                            <option value="mahasiswa">Mahasiswa</option>
                            <option value="dosen">Dosen</option>
                            <option value="petugas">Petugas</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="prodi" class="form-label fw-semibold">Prodi / Unit</label>
                        <input type="text" id="prodi" name="prodi" class="form-control py-2" required>
                    </div>
                    <div class="col-md-6">
                        <label for="no_hp" class="form-label fw-semibold">No. HP</label>
                        <input type="tel" id="no_hp" name="no_hp" class="form-control py-2" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" id="email" name="email" class="form-control py-2" required>
                    </div>
                        <div class="col-12 pt-2">
                            <button type="submit" class="btn btn-primary">Simpan</button>
                            <a href="list.html" class="btn btn-outline-secondary">Batal</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top text-center text-secondary small py-4 mt-auto">
        &copy; 2026 SIMINVENT-Mini &mdash; Jobsheet 3
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
