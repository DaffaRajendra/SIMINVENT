</head>

    <nav class="navbar navbar-expand-xl bg-white border-bottom py-0">
        <div class="container justify-content-xl-center">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary py-3 me-xl-4" href="../index.html">
                <img src="../assets/img/logo.png" alt="Logo SIMINVENT" height="36">
                SIMINVENT-Mini
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse flex-grow-0" id="navMenu">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Beranda</a>

                        <a class="nav-link active" href="../peminjam/tambah.html">Tambah Peminjam</a>
                    </li>
                </ul>
            </div>

    </nav>

    <main class="konten container py-4">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="judul-bagian h4 fw-bold mb-3">Tambah Peminjam</h2>
                <div class="row">
                    <div class="col-md-8 col-lg-6">
                        <form>
                        <div class="mb-3">
                            <label for="nim" class="form-label fw-semibold">NIM / NIP</label>
                            <input type="text" id="nim" name="nim" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="nama" class="form-label fw-semibold">Nama</label>
                            <input type="text" id="nama" name="nama" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label fw-semibold">Status</label>
                            <select id="status" name="status" class="form-select">
                                <option value="mahasiswa">Mahasiswa</option>
                                <option value="dosen">Dosen</option>
                                <option value="petugas">Petugas</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="prodi" class="form-label fw-semibold">Prodi / Unit</label>
                            <input type="text" id="prodi" name="prodi" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="no_hp" class="form-label fw-semibold">No. HP</label>
                            <input type="tel" id="no_hp" name="no_hp" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>
                            <button type="submit" class="btn btn-primary">Simpan</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-secondary small py-4">
        &copy; 2026 SIMINVENT-Mini &mdash; Jobsheet 3
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
