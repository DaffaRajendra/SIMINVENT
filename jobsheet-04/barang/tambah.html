    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" href="../assets/img/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-xl bg-white border-bottom py-0">
        <div class="container justify-content-xl-center">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary py-3 me-xl-4" href="../index.html">
                <img src="../assets/img/logo.png" alt="Logo SIMINVENT" height="36">
                SIMINVENT-Mini
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse flex-grow-0" id="navMenu">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../barang/list.html">Daftar Barang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="../barang/tambah.html">Tambah Barang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../peminjam/list.html">Daftar Peminjam</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../peminjam/tambah.html">Tambah Peminjam</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="konten container py-4">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="judul-bagian h4 fw-bold mb-3">Tambah Barang</h2>
                <div class="row">
                    <div class="col-md-8 col-lg-6">
                        <form>
                        <div class="mb-3">
                            <label for="kode_barang" class="form-label fw-semibold">Kode Barang</label>
                            <input type="text" id="kode_barang" name="kode_barang" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="nama_barang" class="form-label fw-semibold">Nama Barang</label>
                            <input type="text" id="nama_barang" name="nama_barang" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="kategori" class="form-label fw-semibold">Kategori</label>
                            <select id="kategori" name="kategori" class="form-select">
                                <option value="perabotan">Perabotan</option>
                                <option value="elektronik">Elektronik</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="lokasi" class="form-label fw-semibold">Lokasi</label>
                            <input type="text" id="lokasi" name="lokasi" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="stok" class="form-label fw-semibold">Stok</label>
                            <input type="number" id="stok" name="stok" class="form-control" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label for="kondisi" class="form-label fw-semibold">Kondisi</label>
                            <select id="kondisi" name="kondisi" class="form-select">
                                <option value="baik">Baik</option>
                                <option value="rusak">Rusak</option>
                            </select>
                        </div>
                            <button type="submit" class="btn btn-primary">Simpan</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-secondary small py-4">
        &copy; 2026 SIMINVENT-Mini &mdash; Jobsheet 4
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
