<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMINVENT-Mini | Tambah Peminjam</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <a class="brand" href="../index.html">
            <img src="../assets/img/logo.png" alt="Logo SIMINVENT" height="36">
            <span>SIMINVENT-Mini</span>
        </a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../barang/list.html">Daftar Barang</a></li>
                <li><a href="../barang/tambah.html">Tambah Barang</a></li>
                <li><a href="../peminjam/list.html">Daftar Peminjam</a></li>
                <li><a href="../peminjam/tambah.html" class="active">Tambah Peminjam</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Peminjam</h2>
            <form>
            <p>
                <label for="nim">NIM / NIP</label>
                <input type="text" id="nim" name="nim" required>
            </p>
            <p>
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama" required>
            </p>
            <p>
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="mahasiswa">Mahasiswa</option>
                    <option value="dosen">Dosen</option>
                    <option value="petugas">Petugas</option>
                </select>
            </p>
            <p>
                <label for="prodi">Prodi / Unit</label>
                <input type="text" id="prodi" name="prodi" required>
            </p>
            <p>
                <label for="no_hp">No. HP</label>
                <input type="tel" id="no_hp" name="no_hp" required>
            </p>
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <button type="submit">Simpan</button>
            </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMINVENT-Mini &mdash; Jobsheet 3</p>
    </footer>
</body>
</html>
