<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMINVENT-Mini | Tambah Peminjam</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <a class="brand" href="../index.html">
                <img src="../assets/img/logo.png" alt="Logo SIMINVENT" height="40">
                <span>SIMINVENT<em>-Mini</em></span>
            </a>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
            <nav class="menu">
                <ul>
                    <li><a href="../index.html">Beranda</a></li>
                    <li><a href="../barang/list.html">Barang</a></li>
                    <li><a href="../peminjam/list.html" class="active">Peminjam</a></li>
                </ul>
            </nav>
            <div class="aksi">
                <a class="btn btn-outline" href="../barang/tambah.html">+ Tambah Barang</a>
                <a class="btn btn-solid" href="../peminjam/tambah.html">+ Tambah Peminjam</a>
            </div>
        </div>
    </header>

    <section class="judul-halaman">
        <div class="container">
            <ol class="breadcrumb">
                <li><a href="../index.html">Home</a></li>
                <li><a href="list.html">Peminjam</a></li>
                <li class="aktif">Tambah</li>
            </ol>
            <div class="judul-baris">
                <h1>Tambah Peminjam</h1>
            </div>
        </div>
    </section>

    <main>
        <div class="container">
            <section class="kartu">
                <form>
                    <div class="form-grid">
                        <div>
                            <label for="nim">NIM / NIP</label>
                            <input type="text" id="nim" name="nim" required>
                        </div>
                        <div>
                            <label for="nama">Nama</label>
                            <input type="text" id="nama" name="nama" required>
                        </div>
                        <div>
                            <label for="status">Status</label>
                            <select id="status" name="status">
                                <option value="mahasiswa">Mahasiswa</option>
                                <option value="dosen">Dosen</option>
                                <option value="petugas">Petugas</option>
                            </select>
                        </div>
                        <div>
                            <label for="prodi">Prodi / Unit</label>
                            <input type="text" id="prodi" name="prodi" required>
                        </div>
                        <div>
                            <label for="no_hp">No. HP</label>
                            <input type="tel" id="no_hp" name="no_hp" required>
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-aksi">
                            <button type="submit" class="btn btn-solid">Simpan</button>
                            <a href="list.html" class="btn btn-outline">Batal</a>
                        </div>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SIMINVENT-Mini &mdash; Jobsheet 3</p>
    </footer>
</body>
</html>
